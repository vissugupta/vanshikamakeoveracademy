name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.2.3

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ── Windows build ────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: salon-app
        run: pip install -r requirements.txt pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build PyInstaller server binary
        working-directory: desktop
        run: npm run build:server

      - name: Build & publish Windows installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:win

  # ── Linux build ──────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        working-directory: salon-app
        run: pip install -r requirements.txt pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Build PyInstaller server binary
        working-directory: desktop
        run: npm run build:server

      - name: Build & publish Linux packages
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist:linux
