name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.2.3
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ── Windows build ────────────────────────────────────────────────────────────
  build-win:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        working-directory: desktop
        run: python -m pip install -r requirements.txt -r ../salon-app/requirements.txt

      - name: Build Windows desktop executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean pywebview.spec

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: vanshika-makeover-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  # ── Linux build ──────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        working-directory: desktop
        run: python -m pip install -r requirements.txt -r ../salon-app/requirements.txt

      - name: Build Linux desktop executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean pywebview.spec

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: vanshika-makeover-linux
          path: desktop/dist/*
          if-no-files-found: error
