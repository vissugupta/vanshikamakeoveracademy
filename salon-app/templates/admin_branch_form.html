{% extends "admin_base.html" %}
{% block title %}{% if branch %}Edit Branch{% else %}Add Branch{% endif %} — VMA ERP{% endblock %}
{% block page_title %}{% if branch %}Edit Branch{% else %}Add Branch{% endif %}{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl p-5 card-shadow" style="border:1px solid #fde68a;">
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
        Branch Name <span class="text-red-400">*</span>
      </label>
      <input type="text" name="name" value="{{ branch['name'] if branch else '' }}" required
             placeholder="e.g. Lajpat Nagar Branch"
             class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none"
             style="border:1.5px solid #fde68a; background:#fffbf0;">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Address</label>
      <textarea name="address" rows="2"
                class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none resize-none"
                style="border:1.5px solid #fde68a; background:#fffbf0;"
                placeholder="Full address">{{ branch['address'] if branch and branch['address'] else '' }}</textarea>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Phone</label>
      <input type="tel" name="phone" value="{{ branch['phone'] if branch and branch['phone'] else '' }}"
             placeholder="+91 XXXXX XXXXX"
             class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none"
             style="border:1.5px solid #fde68a; background:#fffbf0;">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Manager Name</label>
      <input type="text" name="manager_name" value="{{ branch['manager_name'] if branch and branch['manager_name'] else '' }}"
             placeholder="Manager's full name"
             class="w-full rounded-xl px-4 py-3 text-sm focus:outline-none"
             style="border:1.5px solid #fde68a; background:#fffbf0;">
    </div>
    <div class="flex gap-3 pt-2">
      <a href="{{ url_for('admin_branches') }}"
         class="flex-1 text-center py-3 rounded-xl text-sm font-semibold text-gray-600"
         style="background:#f3f4f6; border:1px solid #e5e7eb;">Cancel</a>
      <button type="submit" class="btn-gold flex-1 py-3 rounded-xl text-sm font-semibold">
        <i class="fa-solid fa-{% if branch %}check{% else %}plus{% endif %} mr-1"></i>
        {% if branch %}Save Changes{% else %}Add Branch{% endif %}
      </button>
    </div>
  </form>
</div>
{% endblock %}
