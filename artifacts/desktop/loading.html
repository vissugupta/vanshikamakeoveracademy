<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #c9a84c;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
      user-select: none;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .sub {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #222;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status {
      font-size: 0.8rem;
      color: #555;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo" id="appName">Salon ERP</div>
  <div class="sub">Starting up…</div>
  <div class="spinner"></div>
  <div class="status" id="status">Launching server, please wait…</div>
  <script>
    // The main process injects the tenant name via IPC before showing the window,
    // but as a fallback we read it from the window title set by the shell.
    if (window.__APP_NAME__) {
      document.getElementById('appName').textContent = window.__APP_NAME__;
    }
  </script>
</body>
</html>
